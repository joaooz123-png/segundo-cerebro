name: Knowledge Growth
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  grow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python workflows/fetch_knowledge.py
      - run: |
          git config user.email bot@segundo-cerebro.ai
          git config user.name Memento-Bot
          git add knowledge-base/
          git diff --staged --quiet || git commit -m "chore: knowledge update"
          git push
