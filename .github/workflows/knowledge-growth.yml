name: Knowledge Growth

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  grow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser requests
      - run: python workflows/fetch_knowledge.py
      - run: |
          git config user.email "segundo-cerebro-bot@users.noreply.github.com"
          git config user.name "Segundo Cerebro Bot"
          git add data-feeds/
          git diff --staged --quiet || (git commit -m "[AUTO] Knowledge update $(date -u +%Y-%m-%d)" && git push)
