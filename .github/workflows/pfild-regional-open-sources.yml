name: PF-ILD regional open sources search

on:
  pull_request:
    branches: [mainn]
    paths:
      - "projects/pfild-ppf-systematic-review/scripts/collect_regional_open_sources.py"
      - ".github/workflows/pfild-regional-open-sources.yml"
      - ".github/agents/pfild-regional-source-auditor.agent.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  regional-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PFILD_REGIONAL_OUTPUT_DIR: projects/pfild-ppf-systematic-review/artifacts/regional_open_sources
      PUBMED_UNION_METADATA_PATH: /tmp/pubmed_artifact/pubmed_union_metadata.csv
      REGIONAL_REQUEST_DELAY: "0.65"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Download full 2,767-PMID PubMed enrichment artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pubmed_artifact
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/joaooz123-png/segundo-cerebro/actions/artifacts/8844988389/zip" \
            -o /tmp/pubmed_artifact.zip
          unzip -q /tmp/pubmed_artifact.zip -d /tmp/pubmed_artifact
          test -s /tmp/pubmed_artifact/pubmed_union_metadata.csv

      - name: Run LILACS/BVS and SciELO searches
        run: python projects/pfild-ppf-systematic-review/scripts/collect_regional_open_sources.py

      - name: Verify governance invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("projects/pfild-ppf-systematic-review/artifacts/regional_open_sources/regional_open_sources_summary.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["human_eligibility_decisions_created"] == 0, data
          assert data["prisma_decisions_created"] == 0, data
          assert data["lilacs"]["unique_records"] >= 0, data
          assert data["scielo"]["unique_records"] >= 0, data
          print(json.dumps(data, indent=2, ensure_ascii=False))
          PY

      - name: Upload regional search artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfild-regional-open-sources
          path: projects/pfild-ppf-systematic-review/artifacts/regional_open_sources/
          if-no-files-found: error
          retention-days: 90
