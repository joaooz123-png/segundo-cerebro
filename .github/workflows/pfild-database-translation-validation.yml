name: PF-ILD database translation validation

on:
  pull_request:
    branches: [mainn]
    paths:
      - "projects/pfild-ppf-systematic-review/search/subscription/**"
      - "projects/pfild-ppf-systematic-review/scripts/validate_database_translations.py"
      - ".github/agents/pfild-database-translation-auditor.agent.md"
      - ".github/workflows/pfild-database-translation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate search translations
        run: python projects/pfild-ppf-systematic-review/scripts/validate_database_translations.py
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: pfild-database-translation-validation
          path: projects/pfild-ppf-systematic-review/artifacts/database_translation_validation.json
          if-no-files-found: error
          retention-days: 90
