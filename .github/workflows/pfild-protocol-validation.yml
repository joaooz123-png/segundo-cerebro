name: PF-ILD protocol package validation

on:
  pull_request:
    branches: [mainn]
    paths:
      - "projects/pfild-ppf-systematic-review/methods/**"
      - "projects/pfild-ppf-systematic-review/scripts/validate_protocol_package.py"
      - ".github/workflows/pfild-protocol-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate protocol package and safeguards
        run: python projects/pfild-ppf-systematic-review/scripts/validate_protocol_package.py
      - name: Upload protocol manifest and validation report
        uses: actions/upload-artifact@v4
        with:
          name: pfild-protocol-v2-validation
          path: projects/pfild-ppf-systematic-review/artifacts/protocol_validation/
          if-no-files-found: error
          retention-days: 90
