name: Wisebase Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python workflows/sync_wisebase.py
        env:
          WISEBASE_API_URL: ${{ secrets.WISEBASE_API_URL }}
          WISEBASE_API_KEY: ${{ secrets.WISEBASE_API_KEY }}
