name: PF-ILD sentinel citation chasing

on:
  pull_request:
    branches: [mainn]
    paths:
      - "projects/pfild-ppf-systematic-review/scripts/collect_sentinel_citations.py"
      - "projects/pfild-ppf-systematic-review/scripts/collect_sentinel_citations_v2.py"
      - ".github/workflows/pfild-sentinel-citation-chasing.yml"
      - "projects/pfild-ppf-systematic-review/data/pubmed_v2_validation/pubmed_v2_sentinel_validation.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect backward and forward citations
        run: python projects/pfild-ppf-systematic-review/scripts/collect_sentinel_citations_v2.py
      - name: Verify safeguards and bidirectional coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("projects/pfild-ppf-systematic-review/artifacts/citation_chasing/citation_chasing_summary.json")
          d=json.loads(p.read_text())
          assert d["sentinels_processed"] == 62, d
          assert d["failures"] == 0, d
          assert d["direction_counts"].get("backward", 0) > 0, d
          assert d["direction_counts"].get("forward", 0) > 0, d
          assert d["human_eligibility_decisions_created"] == 0, d
          assert d["prisma_counts_changed"] == 0, d
          print(json.dumps(d, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pfild-sentinel-citation-chasing
          path: projects/pfild-ppf-systematic-review/artifacts/citation_chasing/
          if-no-files-found: error
          retention-days: 90
