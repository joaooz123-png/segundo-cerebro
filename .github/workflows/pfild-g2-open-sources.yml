name: PF-ILD G2 open sources

on:
  push:
    branches:
      - pfild-g2-open-sources
    paths:
      - .github/workflows/pfild-g2-open-sources.yml
      - projects/pfild-ppf-systematic-review/scripts/collect_g2_open_sources.py
      - projects/pfild-ppf-systematic-review/data/pubmed_v2_validation/pubmed_candidate_union_pmids.csv
  pull_request:
    branches:
      - mainn
    paths:
      - .github/workflows/pfild-g2-open-sources.yml
      - projects/pfild-ppf-systematic-review/scripts/collect_g2_open_sources.py
      - projects/pfild-ppf-systematic-review/data/pubmed_v2_validation/pubmed_candidate_union_pmids.csv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfild-g2-open-sources-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  collect-open-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve target branch
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Europe PMC and ClinicalTrials.gov
        run: python projects/pfild-ppf-systematic-review/scripts/collect_g2_open_sources.py

      - name: Upload source exports
        uses: actions/upload-artifact@v4
        with:
          name: pfild-g2-open-sources-${{ github.run_id }}
          path: projects/pfild-ppf-systematic-review/data/g2_open_sources/
          if-no-files-found: error
          retention-days: 90

      - name: Commit source exports
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- projects/pfild-ppf-systematic-review/data/g2_open_sources)" ]; then
            echo 'No source output changes to commit.'
            exit 0
          fi
          git config user.name 'pfild-review-bot'
          git config user.email 'pfild-review-bot@users.noreply.github.com'
          git add projects/pfild-ppf-systematic-review/data/g2_open_sources
          git commit -m 'data: collect Europe PMC and ClinicalTrials.gov candidate records'
          git fetch origin ${{ steps.target.outputs.branch }}
          git rebase origin/${{ steps.target.outputs.branch }}
          git push origin HEAD:${{ steps.target.outputs.branch }}
