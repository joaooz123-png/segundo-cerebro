name: Market Data

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22,24 * * 1-5'
  workflow_dispatch:

jobs:
  market:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests
      - run: python workflows/fetch_market.py
      - run: |
          git config user.email "segundo-cerebro-bot@users.noreply.github.com"
          git config user.name "Segundo Cerebro Bot"
          git add data-feeds/market/
          git diff --staged --quiet || (git commit -m "[AUTO] Market update $(date -u +%Y-%m-%dT%H:%M)Z" && git push)
