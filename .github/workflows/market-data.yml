name: Market Data

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22,0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests
      - run: python workflows/fetch_market.py
      - run: |
          git config user.email bot@segundo-cerebro.ai
          git config user.name Segundo-Cerebro-Bot
          git add data-feeds/market/
          git diff --staged --quiet || git commit -m "auto market update"
          git push
