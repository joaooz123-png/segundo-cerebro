name: PF-ILD regional search probe

on:
  pull_request:
    branches: [mainn]
    paths:
      - "projects/pfild-ppf-systematic-review/scripts/probe_regional_search.py"
      - ".github/workflows/pfild-regional-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Probe BVS and SciELO search interfaces
        run: python projects/pfild-ppf-systematic-review/scripts/probe_regional_search.py
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfild-regional-search-probe
          path: projects/pfild-ppf-systematic-review/artifacts/regional_probe/
          if-no-files-found: error
          retention-days: 30
