name: PF-ILD grey-source sentinel validation

on:
  pull_request:
    branches: [mainn]
    paths:
      - "projects/pfild-ppf-systematic-review/search/grey/GREY_SOURCE_SENTINELS_V1.csv"
      - "projects/pfild-ppf-systematic-review/methods/GREY_SOURCE_SENTINELS_V1.md"
      - "projects/pfild-ppf-systematic-review/scripts/validate_grey_sentinels.py"
      - ".github/workflows/pfild-grey-sentinel-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate immutable sentinel invariants
        run: python projects/pfild-ppf-systematic-review/scripts/validate_grey_sentinels.py
